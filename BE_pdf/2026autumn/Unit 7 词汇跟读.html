// 两遍朗读之间的停顿。快档故意收短，但还留得下跟读。
const REPEAT_GAP = {
  "0.6": 900,
  "0.75": 760,
  "0.9": 620,
  "1.1": 420,
  "1.3": 280
};
const NEXT_GAP = 80;
const REPEAT_TIMES = 3;

function displayWord(w) {
  const letters = w.replace(/[^a-zA-Z]/g, "");
  if (letters.length > 0 && letters === letters.toUpperCase() && letters.length <= 5) return w;
  return w.toLowerCase();
}

function rateKey() {
  return document.getElementById("rateSelect").value;
}

function repeatGap() {
  return REPEAT_GAP[rateKey()] || 620;
}

function updateGapHint() {
  const sec = (repeatGap() / 1000).toFixed(2);
  document.getElementById("gapHint").textContent = "遍间停顿 " + sec + " 秒";
}

function getVoice() {
  const sel = document.getElementById("voiceSelect");
  const voice = voices[Number(sel.value)];
  return voice || null;
}

function defaultVoiceIndex(list) {
  const prefer = ["Google US English", "Microsoft Aria", "Microsoft Jenny", "Aria", "Jenny", "Zira", "Samantha", "Karen", "Allison"];
  for (const name of prefer) {
    const i = list.findIndex((v) => v.name.includes(name) && /en-US/i.test(v.lang));
    if (i >= 0) return i;
  }
  for (const name of prefer) {
    const i = list.findIndex((v) => v.name.includes(name));
    if (i >= 0) return i;
  }
  const us = list.findIndex((v) => /en-US/i.test(v.lang));
  return us >= 0 ? us : 0;
}

function loadVoices(fromEvent) {
  const hadVoices = voices.length > 0;
  const found = speechSynthesis.getVoices().filter((v) => /^en([-_]|$)/i.test(v.lang));
  if (!found.length) return;
  found.sort((a, b) => {
    const rank = (v) => (/^en-US$/i.test(v.lang) ? 0 : 1);
    return rank(a) - rank(b) || a.name.localeCompare(b.name);
  });
  voices = found;
  const sel = document.getElementById("voiceSelect");
  const keep = preferredVoiceName;
  sel.innerHTML = "";
  voices.forEach((v, i) => {
    const opt = document.createElement("option");
    opt.value = String(i);
    opt.textContent = v.name + "（" + v.lang + "）";
    sel.appendChild(opt);
  });
  let pick = keep ? voices.findIndex((v) => v.name === keep) : -1;
  if (pick < 0) pick = defaultVoiceIndex(voices);
  sel.value = String(pick);
  preferredVoiceName = voices[pick] ? voices[pick].name : "";
  if (fromEvent && playbackStarted && !hadVoices && !voiceRestarted && !paused) {
    voiceRestarted = true;
    restartAt(phase === "gap" ? pendingIndex : activeIndex);
  }
}

function clearTimers() {
  clearTimeout(gapTimer);
  clearTimeout(watchTimer);
  clearTimeout(kickTimer);
  clearTimeout(retryTimer);
  gapTimer = 0;
  watchTimer = 0;
  kickTimer = 0;
  retryTimer = 0;
}

function detachAndCancel(forceCancel) {
  const utter = currentUtter;
  currentUtter = null;
  if (utter) {
    utter.onend = null;
    utter.onerror = null;
    utter.onstart = null;
  }
  const busy = !!(speechSynthesis.speaking || speechSynthesis.pending || speechSynthesis.paused);
  if (forceCancel || busy) {
    try { speechSynthesis.cancel(); } catch (e) { /* ignore */ }
    lastCancelAt = performance.now();
    return true;
  }
  return false;
}

function waitAfterCancel() {
  if (!lastCancelAt) return 30;
  const since = performance.now() - lastCancelAt;
  return since >= 130 ? 30 : Math.max(30, 140 - since);
}

// 打断后不要立刻 speak。Chrome / Edge 会把紧跟 cancel() 的朗读丢掉，听起来像没声音。
function beginIndex(index) {
  gen += 1;
  const my = gen;
  clearTimers();
  const cancelled = detachAndCancel(false);
  hold = true;
  kickTimer = setTimeout(() => {
    hold = false;
    if (my !== gen || paused) return;
    try { speechSynthesis.resume(); } catch (e) { /* ignore */ }
    playIndex(index, my);
  }, cancelled ? 140 : waitAfterCancel());
  return my;
}

function expectMs(text, rate) {
  const chunks = text.trim().split(/\s+/).length;
  const chars = text.replace(/\s+/g, "").length;
  return Math.max(700, (chars * 80 + chunks * 180) / rate + 320);
}

function isEdge() {
  return /Edg\//.test(navigator.userAgent);
}

function startLimit() {
  const voice = getVoice();
  const local = !!(voice && voice.localService === true);
  // Edge 经常不发 onstart。这里只用来判断「朗读有没有被丢掉」，不能拿来提前 cancel。
  if (isEdge()) return local ? 900 : 1200;
  if (local) return 400;
  return 800;
}

function dropUtterance() {
  if (currentUtter) {
    currentUtter.onend = null;
    currentUtter.onerror = null;
    currentUtter.onstart = null;
    currentUtter = null;
  }
  try { speechSynthesis.cancel(); } catch (e) { /* ignore */ }
  lastCancelAt = performance.now();
}

function playIndex(index, my) {
  if (paused || my !== gen) return;
  phase = "speak";
  activeIndex = index;
  paintDots(index);

  const text = words[current].word;
  const rate = parseFloat(rateKey());
  let settled = false;
  let tries = 0;
  const maxTries = 2;

  const goNext = () => {
    if (settled || my !== gen || paused) return;
    settled = true;
    clearTimeout(watchTimer);
    clearTimeout(retryTimer);
    clearTimeout(kickTimer);
    phase = "gap";
    if (index < REPEAT_TIMES - 1) {
      pendingIndex = index + 1;
      gapTimer = setTimeout(() => playIndex(index + 1, my), repeatGap());
    } else {
      pendingIndex = 0;
      gapTimer = setTimeout(() => {
        if (my !== gen || paused) return;
        goTo(current + 1);
      }, NEXT_GAP);
    }
  };

  const blockEngine = () => {
    settled = true;
    clearTimeout(watchTimer);
    clearTimeout(retryTimer);
    clearTimeout(kickTimer);
    engineBlocked = true;
    paused = true;
    updatePlayBtn();
  };

  const armEndWatch = (from) => {
    clearTimeout(watchTimer);
    const startedAt = typeof from === "number" ? from : performance.now();
    const limit = expectMs(text, rate) + (isEdge() ? 800 : 350);
    const check = () => {
      if (settled || my !== gen || paused) return;
      if (performance.now() - startedAt >= limit) {
        dropUtterance();
        goNext();
        return;
      }
      watchTimer = setTimeout(check, 120);
    };
    watchTimer = setTimeout(check, 200);
  };

  const retryLater = () => {
    dropUtterance();
    if (tries >= maxTries) {
      goNext();
      return;
    }
    kickTimer = setTimeout(() => {
      if (settled || my !== gen || paused) return;
      try { speechSynthesis.resume(); } catch (e) { /* ignore */ }
      speakOnce();
    }, isEdge() ? 280 : 120);
  };

  const speakOnce = () => {
    if (settled || my !== gen || paused) return;
    tries += 1;
    const attempt = tries;
    let started = false;
    const utter = new SpeechSynthesisUtterance(text);
    utter.rate = rate;
    utter.pitch = 1;
    utter.volume = 1;
    utter.lang = "en-US";
    const voice = getVoice();
    if (voice) {
      utter.voice = voice;
      utter.lang = voice.lang || "en-US";
    }
    utter.onstart = () => {
      if (attempt !== tries || settled || my !== gen) return;
      started = true;
      clearTimeout(retryTimer);
      armEndWatch();
    };
    utter.onend = () => {
      if (attempt !== tries || settled || my !== gen) return;
      goNext();
    };
    utter.onerror = (ev) => {
      if (attempt !== tries || settled || my !== gen) return;
      clearTimeout(retryTimer);
      const err = (ev && ev.error) || "";
      if (err === "interrupted" || err === "canceled" || err === "cancelled") return;
      if (err === "not-allowed") {
        blockEngine();
        return;
      }
      if (!started && tries < maxTries) {
        retryLater();
        return;
      }
      goNext();
    };
    currentUtter = utter;
    try { speechSynthesis.resume(); } catch (e) { /* ignore */ }
    speechSynthesis.speak(utter);
    const spokenAt = performance.now();

    // Chrome：pending 却一直没有 onstart，就取消并重读。
    // Edge：没有 onstart 但引擎仍在读时不能 cancel，否则这次和紧接着的下一次都会没声。
    retryTimer = setTimeout(() => {
      if (started || settled || my !== gen || paused || attempt !== tries) return;
      const busy = !!(speechSynthesis.speaking || speechSynthesis.pending || speechSynthesis.paused);
      if (isEdge() && busy) {
        try { speechSynthesis.resume(); } catch (e) { /* ignore */ }
        armEndWatch(spokenAt);
        return;
      }
      retryLater();
    }, startLimit());
  };

  speakOnce();
}

function goTo(index) {
  current = (index + words.length) % words.length;
  showCard(current);
  if (!paused) beginIndex(0);
}

function showCard(index) {
  const data = words[index];
  document.getElementById("wordEl").textContent = displayWord(data.word);
  document.getElementById("phoneticEl").textContent = data.phonetic;
  document.getElementById("posCnEl").textContent = data.posCn;
  document.getElementById("exEnEl").textContent = data.exEn;
  document.getElementById("exCnEl").textContent = data.exCn;
  document.getElementById("counter").textContent = (index + 1) + " / " + words.length;
  document.getElementById("progressFill").style.width = (((index + 1) / words.length) * 100) + "%";
  document.title = "Unit 7 · " + displayWord(data.word);
  clearDots();
  const card = document.getElementById("card");
  card.style.animation = "none";
  void card.offsetWidth;
  card.style.animation = "";
}

function paintDots(index) {
  for (let i = 0; i < REPEAT_TIMES; i += 1) {
    const dot = document.getElementById("d" + i);
    dot.classList.toggle("done", i < index);
    dot.classList.toggle("current", i === index);
  }
}

function clearDots() {
  for (let i = 0; i < REPEAT_TIMES; i += 1) {
    document.getElementById("d" + i).classList.remove("done", "current");
  }
}

function updatePlayBtn() {
  const btn = document.getElementById("playBtn");
  if (paused) {
    btn.textContent = engineBlocked ? "▶ 开始跟读" : "▶ 继续";
    btn.classList.add("is-paused");
  } else {
    btn.textContent = "⏸ 暂停";
    btn.classList.remove("is-paused");
  }
}

function togglePause() {
  if (!paused) {
    paused = true;
    engineBlocked = false;
    updatePlayBtn();
    gen += 1;
    clearTimers();
    detachAndCancel(true);
    hold = false;
    return;
  }
  paused = false;
  engineBlocked = false;
  updatePlayBtn();
  const index = phase === "gap" ? pendingIndex : activeIndex;
  beginIndex(index);
}

function restartAt(index) {
  if (paused) return;
  beginIndex(index);
}

document.getElementById("prevBtn").addEventListener("click", () => goTo(current - 1));
document.getElementById("nextBtn").addEventListener("click", () => goTo(current + 1));
document.getElementById("playBtn").addEventListener("click", togglePause);

document.getElementById("rateSelect").addEventListener("change", () => {
  updateGapHint();
  if (paused) return;
  restartAt(phase === "gap" ? pendingIndex : activeIndex);
});

document.getElementById("voiceSelect").addEventListener("change", () => {
  const voice = getVoice();
  preferredVoiceName = voice ? voice.name : "";
  if (paused) return;
  restartAt(phase === "gap" ? pendingIndex : activeIndex);
});

document.addEventListener("keydown", (e) => {
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === "SELECT" || tag === "INPUT" || tag === "TEXTAREA") return;
  if (e.key === "ArrowRight") {
    e.preventDefault();
    goTo(current + 1);
  } else if (e.key === "ArrowLeft") {
    e.preventDefault();
    goTo(current - 1);
  } else if (e.key === " ") {
    e.preventDefault();
    togglePause();
  }
});

if (speechSynthesis.onvoiceschanged !== undefined) {
  speechSynthesis.onvoiceschanged = () => loadVoices(true);
}
loadVoices(false);
updateGapHint();

// 点开语速菜单时，有的浏览器会把正在读的句子暂停住，结束事件也不再来。
setInterval(() => {
  if (paused || hold || !currentUtter) return;
  if (speechSynthesis.paused) {
    try { speechSynthesis.resume(); } catch (e) { /* ignore */ }
  }
}, 250);

window.addEventListener("beforeunload", () => {
  try { speechSynthesis.cancel(); } catch (e) { /* ignore */ }
});

let mediaRecorder = null;
let recordedChunks = [];

document.getElementById("recBtn").addEventListener("click", async () => {
  const btn = document.getElementById("recBtn");
  if (mediaRecorder && mediaRecorder.state === "recording") {
    mediaRecorder.stop();
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({
      video: { frameRate: 15 },
      audio: true
    });
    recordedChunks = [];
    const types = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"];
    const mime = types.find((t) => MediaRecorder.isTypeSupported(t)) || "";
    mediaRecorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) recordedChunks.push(e.data);
    };
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach((t) => t.stop());
      const blob = new Blob(recordedChunks, { type: mime || "video/webm" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "Unit7-Job-Hunting-词汇跟读.webm";
      a.click();
      URL.revokeObjectURL(url);
      btn.textContent = "⏺ 开始录制";
      btn.classList.remove("recording");
    };
    mediaRecorder.start();
    btn.textContent = "⏹ 停止录制";
    btn.classList.add("recording");
  } catch (err) {
    if (err && err.name === "NotAllowedError") return;
    alert("录制没有开始：" + err.message);
  }
});

showCard(0);
phase = "gap";
pendingIndex = 0;
playbackStarted = true;
if (voices.length) voiceRestarted = true;
beginIndex(0);
</script>
</body>
</html>
